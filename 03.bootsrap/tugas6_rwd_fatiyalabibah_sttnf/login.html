<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Tugas 6 RWD Bootstrap</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Custom Style -->
    <link rel="stylesheet" href="style.css">
    <style>
        .login-card {
            background: white;
            border-radius: var(--radius);
            padding: 50px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.05);
            max-width: 450px;
            width: 100%;
            margin: auto;
        }

        .form-control {
            border-radius: 12px;
            padding: 12px 20px;
            border: 1px solid rgba(0, 0, 0, 0.1);
            background: var(--apple-gray);
        }

        .btn-apple {
            background: var(--apple-purple);
            color: white;
            border: none;
            border-radius: 980px;
            padding: 12px 30px;
            font-weight: 600;
            width: 100%;
            transition: var(--transition);
        }

        .btn-apple:hover {
            transform: scale(1.02);
            filter: brightness(1.1);
            color: white;
            background-color: rgb(180, 128, 196);
        }
    </style>
</head>

<body class="bg-light">

    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg sticky-top navbar-light">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="index.html">
                <img src="assets/logo.png" alt="Logo">
                <span class="fw-bold">Fatiya Labibah</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="study.html">MyStudy</a></li>
                    <li class="nav-item"><a class="nav-link" href="gallery.html">Gallery</a></li>
                    <li class="nav-item"><a class="nav-link" href="datatables.html">Datatable</a></li>
                    <li class="nav-item"><a class="nav-link active" href="login.html">Login</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Wrapper: 2-Column Grid -->
    <div class="container main-wrapper">
        <div class="row g-4">
            <!-- Left Sidebar -->
            <aside class="col-lg-3">
                <div class="card-apple h-100">
                    <h5 class="sidebar-title">Auth Links</h5>
                    <ul class="sidebar-list">
                        <li><a href="#">Register</a></li>
                        <li><a href="#">Reset Password</a></li>
                        <li><a href="#">Help Center</a></li>
                    </ul>
                </div>
            </aside>

            <!-- Main Content Area: Login Form -->
            <main class="col-lg-9">
                <div class="card-apple h-100 d-flex align-items-center justify-content-center p-5">
                    <div class="login-card">
                        <div class="text-center mb-5">
                            <h2 class="fw-bold">Login</h2>
                            <p class="text-secondary">Please enter your details to sign in.</p>
                        </div>
                        <form>
                            <div class="mb-4">
                                <label class="form-label small fw-semibold text-uppercase text-secondary">Email
                                    address</label>
                                <input type="email" class="form-control" placeholder="Masukan Email Anda">
                            </div>
                            <div class="mb-4">
                                <div class="d-flex justify-content-between">
                                    <label
                                        class="form-label small fw-semibold text-uppercase text-secondary">Password</label>
                                    <a href="#" class="small text-decoration-none">Forgot?</a>
                                </div>
                                <input type="password" class="form-control" placeholder="Masukan Password Anda">
                            </div>
                            <div class="mb-5 form-check">
                                <input type="checkbox" class="form-check-input" id="remember">
                                <label class="form-check-label small" for="remember">Remember me for 30 days</label>
                            </div>
                            <button type="submit" class="btn btn-apple">Sign In</button>
                        </form>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer-apple">
        <div class="container text-center">
            <p class="mb-3">Develop by Fatiya Labibah &copy; 2026. Fullstack Web Developer Mentee.</p>
            <div class="social-icons">
                <a href="https://www.instagram.com/dambelsbru_" target="_blank"><i class="bi bi-instagram"></i></a>
                <a href="https://www.threads.net/@elfrumoasa" target="_blank"><i class="bi bi-threads"></i></a>
                <a href="https://wa.me/6281901702063" target="_blank"><i class="bi bi-whatsapp"></i></a>
                <a href="https://www.linkedin.com/in/fatiya-labibah" target="_blank"><i class="bi bi-linkedin"></i></a>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
