<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="css/nav.css">
</head>

<body>
    <nav id="navbar">
        <!-- hyperlink internal -->
        <a href="home.html" target="mainContent" class="active">Home</a>
        <a href="study.html" target="mainContent">MyStudy</a>
        <a href="gallery.html" target="mainContent">Gallery</a>
    </nav>

    <script>
        const links = document.querySelectorAll('#navbar a');

        links.forEach(link => {
            link.addEventListener('click', function () {
                links.forEach(l => l.classList.remove('active'));
                this.classList.add('active');
            });
        });
    </script>
</body>

</html>
