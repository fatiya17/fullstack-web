<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Object</title>
</head>
<body>
    <div id="parent" style="padding: 20px;">
        Parent Div
        <div id="child" style="padding: 20px; background-color: lightgray;">
            Child Div
    </div>
    <button id="myButton">Click Me</button>
    <a href="https://www.google.com" id="myLink">Click Link</a>

    <!-- event object -->
    <script>
        document.getElementById('myButton').addEventListener('click', function(event) {
            console.log('Event Type:', event.type);
            console.log('Target Element:', event.target);
            console.log('Mouse Coordinates:', event.clientX, event.clientY);
        });

        // prevent default behavior
        document.getElementById('myLink').addEventListener('click', function(event) {
            event.preventDefault(); 
            alert('Tautan tidak diarahkan');
        });

        // stop propagation
        document.getElementById('parent').addEventListener('click', function(event) {
            alert('Event juga terjadi pada parent');
        });
        document.getElementById('child').addEventListener('click', function(event) {
            event.stopPropagation(); 
            alert('Event hanya terjadi pada child');
        });
    </script>
</body>
</html>
