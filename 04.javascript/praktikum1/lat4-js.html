<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Variable</title>
</head>
<body>
    <script>
        var kalimat = "Belajar JavaScript";
        alert(kalimat);
        document.write(kalimat);
        console.log(kalimat);

        document.write("<br><br>");

        let teks = "Belajar Web";
        alert(teks);
        document.write(teks);
        console.log(teks);

        document.write("<br><br>");

        let nama = "Fatiya Labibah"
        let pekerjaan = "Mahasiswa";
        let umur = 20; // tipe data integer
        let berat = 40.5; // tipe data float
        let kursus = "NF Academy"
        let alamat = "Jl. Jendral Sudirman No. 1";
        document.write("saya kursus di " + kursus);
        document.write("<br>");
        document.write("lokasi tempat di " +alamat); 
        
        document.write("<br><br>");

        document.write("Nama Saya: " + nama + "<br>Seorang " + pekerjaan + "<br>Berumur " + umur + " Tahun dengan berat badan " + berat + " Kg");

        document.write("<br><br>");

        var produk = "Laptop";
        let stok = 10;
        const harga = 5000000;
        document.write("Produk: " + produk + "<br>Stok: " + stok + "<br>Harga: Rp. " + harga);

        document.write("<br><br>");

        let namaku = "Fatiya"
        const umurku = 20;

        namaku = "Labibah";
        document.write("Nama Saya: " + namaku + "<br>Umur Saya: " + umurku + " Tahun");

        document.write("<br><br>");

        //deklarasi dan inisialisasi variabel constanta
        let jari2 = 15;
        const PHI = 3.14;
        // hitung keliling dan luas lingkaran
        let keliling = 2 * PHI * jari2;
        let luas = PHI * jari2 * jari2;
        //cetak hasil
        document.write("Diketahui jari-jari semua lingkaran: " + jari2 + "cm" + "<br>Keliling lingkaran: " + keliling + "<br>Luas lingkaran: " + luas);
    </script>
</body>
</html>
