<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operator Perbandingan</title>
</head>

<body>
    <script>
        let x = 10;
        let y = 20;

        //operator ==
        document.write("Hasil x == y: " + (x == y) + "<br>"); // false

        //operator ===
        document.write("Hasil x === y: " + (x === y) + "<br>"); // false

        //operator !==
        document.write("Hasil x !== y: " + (x !== y) + "<br>"); // true

        //operator >
        document.write("Hasil x > y: " + (x > y) + "<br>"); // false

        //operator <
        document.write("Hasil x < y: " + (x < y) + "<br>"); // true

        //operator >=
        document.write("Hasil x >= y: " + (x >= y) + "<br>"); // false

        //operator <=
        document.write("Hasil x <= y: " + (x <= y) + "<br>"); // true
    </script>
</body>

</html>
