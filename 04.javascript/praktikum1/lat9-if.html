<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IF KONDISI</title>
</head>

<body>
    <!-- jika umur lebih 20 tahun, maka anda dapat mengendarai mobil
     jika umur lebih 17 tahun, maka anda dapat mengendari motor
     jika umur lebih 10 tahun, maka anda dapat mengendarai sepeda
     selain itu tidak boleh -->
    <script>
        let umur = prompt("Masukkan umur Anda: ");
        if (umur >= 19) {
            document.write("Anda dapat mengendarai mobil");
        } else if (umur >= 17) {
            document.write("Anda dapat mengendarai motor");
        } else if (umur >= 10) {
            document.write("Anda dapat mengendarai sepeda");
        } else {
            document.write("Anda tidak boleh mengendarai kendaraan");
        }
    </script>
</body>

</html>
