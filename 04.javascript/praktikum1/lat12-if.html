<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IF Multiple Kondisi</title>
</head>
<body>
    <script>
        let siswa = "Budi Santoso";
        let nilai = 85;
        let grade = "";
        let ket = "";
        let predikat = "";

        ket = (nilai >= 60) ? "Lulus" : "Tidak Lulus";

        //if multikondisi && (AND)
        if (nilai > 85 && nilai <=100) grade = "A";
        else if (nilai > 70 && nilai <= 85) grade = "B";
        else if (nilai > 60 && nilai <= 75) grade = "C";
        else if (nilai > 30 && nilai <= 60) grade = "D";
        else if (nilai >= 0 && nilai <= 30) grade = "E";
        else grade = "Nilai tidak valid";

        //switch case
        switch(grade) {
            case "A":
                predikat = "Sempurna";
                break;
            case "B":
                predikat = "Baik";
                break;
            case "C":
                predikat = "Cukup";
                break;
            case "D":
                predikat = "Kurang";
                break;
            case "E":
                predikat = "Buruk";
                break;
            default:
                predikat = "Tidak ada predikat";
        }

        //cetak
        document.write("Nama Mahasiswa: " + siswa + "<br>");
        document.write("Nilai: " + nilai + "<br>");
        document.write("Grade: " + grade + "<br>");
        document.write("Keterangan: " + ket + "<br>");
        document.write("Predikat: " + predikat);
    </script>
</body>
</html>
