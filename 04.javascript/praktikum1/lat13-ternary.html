<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ternary</title>
</head>
<body>
    <script>
        //ternary atau kondisi dalam suatu waktu dan untuk menentukan kondisi tergantung variabel kunci

        let siswa = "Budi Santoso";
        let nilai = 85;
        let ket = (nilai >= 60) ? "Lulus" : "Tidak Lulus";
        document.write("Nama Mahasiswa: " + siswa + "<br>");
        document.write("Nilai: " + nilai + "<br>");
        document.write("Keterangan: " + ket);
    </script>
</body>
</html>
