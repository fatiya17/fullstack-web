<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operator Aritmatika</title>
</head>
<body>
    <script>
        let a = 10;
        let b = 5;

        // Operator Aritmatika
        let penjumlahan = a + b; // 15
        let pengurangan = a - b; // 5
        let perkalian = a * b; // 50
        let pembagian = a / b; // 2
        let modulus = a % b; // 0
        let increment = a++; // 10 (nilai a setelah increment adalah 11)
        let decrement = b--; // 5 (nilai b setelah decrement adalah 4)

        document.write("Hasil Penjumlahan: " + penjumlahan + "<br>");
        document.write("Hasil Pengurangan: " + pengurangan + "<br>");
        document.write("Hasil Perkalian: " + perkalian + "<br>");
        document.write("Hasil Pembagian: " + pembagian + "<br>");
        document.write("Hasil Modulus: " + modulus + "<br>");
        document.write("Hasil Increment: " + increment + "<br>");
        document.write("Hasil Decrement: " + decrement + "<br>");
    </script>
</body>
</html>
