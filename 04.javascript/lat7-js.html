<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operator Assignment</title>
</head>
<body>
    <script>
        let a = 10;
        let b = 5;

        //operator =
        document.write("Nilai a: " + a + "<br>"); // 10
        
        document.write("<br>");
        //operator +=
        a += 5; // a = a + b
        document.write("a += 5= " + a + "<br>"); // 15

        document.write("<br>");
        //operator -=
        a -= 3; // a = a - b
        document.write("a -= 3: " + a + "<br>"); // 12

        document.write("<br>");
        //operator *=
        a *= 2; // a = a * b
        document.write("a *= 2: " + a + "<br>"); // 24

        document.write("<br>");
        //operator /=
        a /= 4; // a = a / b
        document.write("a /= 4: " + a + "<br>"); // 6

        document.write("<br>");
        //operator %=
        a %= 5; // a = a % b
        document.write("a %= 5: " + a + "<br>"); // 1

        document.write("<br>");
        //operator **=
        a **= 3; // a = a ** b
        document.write("a **= 3: " + a + "<br>"); // 1
    </script>
</body>
</html>
