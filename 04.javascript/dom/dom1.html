<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mengubah Teks Elemen</title>
</head>
<body>
    <h1 id="judul">Selamat Datang</h1>
    <button onclick="ubahTeks()">Ubah Teks</button>
    <p id="paragraph">Ini adalah paragraf</p>
    <button onclick="ubahGaya()">Ubah Gaya</button>

    <div class="container">
        <p id="paragraph">Ini adalah paragraph</p>
    </div>

    <button onclick="tambahElemen()">Tambah Elemen</button>
    <button onclick="hapusElemen()">Hapus Elemen</button>

    <script>
        function ubahTeks(){
            document.getElementById("judul").innerText = "Teks Selamat Datang diubah ke Selamat Datang"
        }
        function ubahGaya(){
            document.getElementById("judul").style.color = "blue";
            document.getElementById("paragraph").style.fontSize = "20px";
        }
        function tambahElemen(){
            let paragraphBaru = document.createElement("p");
            paragraphBaru.innerText = "Paragraph Baru telah ditambahkan";
            document.getElementById("container").appendChild(paragraphBaru);
        }
        function hapusElemen(){
            let container = document.getElementById("container");
            let paragraph = document.getElementById("paragraph");
            if(container.contains(paragraph)){
            container.removeChild(paragraph);
        } else {
            alert("Paragraph tidak ditemukan");
        }
        }
    </script>
</body>
</html>
