<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <title>Selector Hierarki</title>
</head>

<body>
    <div>
        <h2>Judul</h2>
        <p>Paragraph dalam Div</p>
    </div>

    <p>Paragraph di luar Div</p>
    <button id="ubah">Sorot paragraph didalam Div</button>
    <script>
        $(document).ready(function () {
            $("#ubah").click(function () {
                $("div p").css("background", "yellow"); // selector hierarki
            });
        });
    </script>
</body>

</html>
