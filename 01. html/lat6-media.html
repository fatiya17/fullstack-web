<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Type</title>
    <style>
        @media screen {
            .tulis {
                color: rgb(79, 174, 212);
                font-size: 24px;
                font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            }
        }
        @media print {
            p.tulis {
                color: rgb(152, 196, 213);
                font-size: 100px;
                font-family: Arial, Helvetica, sans-serif;
            }
        }
    </style>
</head>
<body>
    <p class="tulis">NF ACADEMY</p>
</body>
</html>
