<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan Table</title>
</head>

<body>
    <table border="1" cellpadding="5" cellspacing="5" width=50%">
        <caption>Daftar Belanja</caption>
        <thead bgcolor="lightblue">
            <tr>
                <th>No</th>
                <th>Nama Barang</th>
                <th>Unit</th>
                <th>Harga</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>Sabun</td>
                <td>1</td>
                <td>3.000</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Shampoo</td>
                <td>2</td>
                <td>5.000</td>
            </tr>
            <tr>
                <td>3</td>
                <td>Minyak</td>
                <td>2</td>
                <td>7.000</td>
            </tr>
        </tbody>
        <tfoot bgcolor="lightyellow">
            <tr>
                <td colspan="3">Total Harga</td>
                <td>27.000</td>
            </tr>
        </tfoot>
    </table>
</body>

</html>
