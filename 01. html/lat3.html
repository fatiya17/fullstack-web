<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan Table</title>
    <link rel="stylesheet" href="lat3.css">
</head>

<body>
    <table border="0" cellpadding="5" cellspacing="5" width=50%">
        <caption>Daftar Belanja</caption>
        <thead>
            <tr class="tr1">
                <th>No</th>
                <th>Nama Barang</th>
                <th>Unit</th>
                <th>Harga</th>
            </tr>
        </thead>
        <tbody>
            <tr class="tr2">
                <td>1</td>
                <td>Sabun</td>
                <td>1</td>
                <td>3.000</td>
            </tr>
            <tr class="tr2">
                <td>2</td>
                <td>Shampoo</td>
                <td>2</td>
                <td>5.000</td>
            </tr>
            <tr class="tr2">
                <td>3</td>
                <td>Minyak</td>
                <td>2</td>
                <td>7.000</td>
            </tr>
        </tbody>
        <tfoot>
            <tr class="tr1">
                <td colspan="3">Total Harga</td>
                <td>27.000</td>
            </tr>
        </tfoot>
    </table>
</body>

</html>
