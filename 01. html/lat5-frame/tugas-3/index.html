<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tugas Frameset - Fullstack Web</title>
    <style>
        body {
            background-color: #f7d8be;
            text-align: center;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif
        }

        a {
            color: #000000;
            text-decoration: none;
            margin: 0 20px;
            font-weight: bold;
        }

        a:hover {
            color: rgb(222, 112, 28);
        }
    </style>
</head>
<!-- setting frameset  -->
<frameset rows="20%, 6%, *, 10%" border="1">
    <!-- setting frame -->
    <frame src="header.html" name="header" noresize scrolling="no"></frame>
    <frame src="navigation.html" name="navigation" noresize scrolling="no"></frame>
    <frameset cols="20%, *, 20%">
        <frame src="left.html" name="leftContent"></frame>
        <frame src="home.html" name="mainContent"></frame>
        <frame src="right.html" name="rightContent"></frame>
    </frameset>
    <frame src="footer.html" name="footer" noresize scrolling="no"></frame>
</frameset>
<noframes>
    <body>
        <p>Browser Anda tidak mendukung frameset.</p>
    </body>
</noframes>
</html>
