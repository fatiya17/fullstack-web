<!DOCTYPE html>
<html lang="en">

<head>
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
            text-align: center;
        }

        .gallery-img {
            width: 300px;
            height: 200px;
            object-fit: cover;
            border: 2px solid #333;
            margin: 10px;
            transition: transform 0.3s;
            flex-shrink: 0;
        }

        .gallery-img:hover {
            transform: scale(1.05);
        }

        .scroll-container {
            width: 100%;
            overflow: hidden;
            background-color: #f9f9f9;
            padding: 10px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
            display: flex;
        }

        .scroll-content {
            display: flex;
            animation: scroll 20s linear infinite;
        }

        .scroll-content a {
            display: flex;
            flex-shrink: 0;
        }

        @keyframes scroll {
            0% {
                transform: translateX(0);
            }

            100% {
                transform: translateX(-50%);
            }
        }

        .scroll-container:hover .scroll-content {
            animation-play-state: paused;
        }
    </style>
</head>

<body>
    <h1>Portfolio Gallery</h1>
    <div class="scroll-container">
        <div class="scroll-content">
            <a href="https://aiwonder.vercel.app" target="_blank"><img src="./assets/wonderAI.png" alt="Wonder AI"
                    class="gallery-img"></a>

                    alt="Info Wisata" class="gallery-img"></a>

                    class="gallery-img"></a>
