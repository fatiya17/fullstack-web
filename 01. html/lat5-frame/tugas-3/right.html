<!DOCTYPE html>
<html lang="en">

<head>
    <style>
        body {
            font-family: sans-serif;
            padding: 10px;
        }

        fieldset {
            border-radius: 8px;
            border: 2px solid #333;
        }

        legend {
            font-weight: bold;
            padding: 0 10px;
        }

        ul {
            padding-left: 20px;
        }

        li {
            padding: 5px 0;
        }
        
        a {
            color: #cf688e;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <fieldset>
        <legend>Full-Stack Learning Materials</legend>
        <ul>
            <li><a href="https://developer.mozilla.org/en-US/docs/Web/HTML" target="_blank">HTML5 Fundamentals</a></li>
            <li><a href="https://developer.mozilla.org/en-US/docs/Web/CSS" target="_blank">CSS3 Advanced Layouts</a>
            </li>
            <li><a href="https://developer.mozilla.org/en-US/docs/Web/JavaScript" target="_blank">Modern JavaScript
                    (ES6+)</a></li>
            <li><a href="https://react.dev" target="_blank">React Framework</a></li>
            <li><a href="https://nodejs.org" target="_blank">Node.js Backend</a></li>
        </ul>
    </fieldset>
</body>

</html>
